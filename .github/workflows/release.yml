name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Создание папок
      - name: Prepare build
        shell: pwsh
        run: |
          mkdir build
          mkdir build/client
          mkdir build/server

          if (Test-Path "client") {
            Copy-Item client/* build/client -Recurse -Force
          } else {
            Write-Host "Skipping: 'client' folder not found"
          }

          if (Test-Path "shared") {
            Copy-Item shared/* build/client -Recurse -Force
            Copy-Item shared/* build/server -Recurse -Force
          } else {
            Write-Host "Skipping: 'shared' folder not found"
          }

          if (Test-Path "server") {
            Copy-Item server/* build/server -Recurse -Force
          } else {
            Write-Host "Skipping: 'server' folder not found"
          }

      # Архивирование
      - name: Zip Client
        shell: pwsh
        run: Compress-Archive -Path build/client/* -DestinationPath client.zip

      - name: Zip Server
        shell: pwsh
        run: Compress-Archive -Path build/server/* -DestinationPath server.zip

      # Генерация sync-файлов (учитываются удаления за последние 20 релизов)
      - name: Generate Sync Files
        shell: pwsh
        env:
          MC_LOADER: ${{ vars.MC_LOADER }}
          MC_VERSION: ${{ vars.MC_VERSION }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $mcLoader = $env:MC_LOADER
          $mcVersion = $env:MC_VERSION

          $allTags = @(git tag --sort=creatordate)
          Write-Host "All tags in order: $allTags"

          $maxReleases = 20
          if ($allTags.Count -gt $maxReleases) {
            $recentTags = $allTags[-$maxReleases..-1]   # последние 20
          } else {
            $recentTags = $allTags
          }

          $comparisonPoints = @($recentTags) + @("HEAD")
          Write-Host "Analyzing tags: $recentTags and HEAD"

          function Get-DeletedInDiff {
            param([string]$OldRef, [string]$NewRef, [string[]]$Prefixes)

            $deleted = [System.Collections.Generic.HashSet[string]]::new()
            $diff = git diff --name-status "$OldRef" "$NewRef" -- $Prefixes
            foreach ($line in $diff) {
              if (-not $line) { continue }
              $parts = $line -split "`t"
              $status = $parts[0]
              $filePath = $parts[1]
              if ($status -eq "D") {
                foreach ($prefix in $Prefixes) {
                  if ($filePath -like "$prefix/*") {
                    $rel = $filePath.Substring($prefix.Length + 1)
                    [void]$deleted.Add($rel)
                    break
                  }
                }
              }
            }
            return $deleted
          }

          function Get-AddedInDiff {
            param([string]$OldRef, [string]$NewRef, [string[]]$Prefixes)

            $added = [System.Collections.Generic.HashSet[string]]::new()
            $diff = git diff --name-status "$OldRef" "$NewRef" -- $Prefixes
            foreach ($line in $diff) {
              if (-not $line) { continue }
              $parts = $line -split "`t"
              $status = $parts[0]
              $filePath = $parts[1]
              if ($status -eq "A") {
                foreach ($prefix in $Prefixes) {
                  if ($filePath -like "$prefix/*") {
                    $rel = $filePath.Substring($prefix.Length + 1)
                    [void]$added.Add($rel)
                    break
                  }
                }
              }
            }
            return $added
          }

          $finalDeletedClient = [System.Collections.Generic.HashSet[string]]::new()
          $finalDeletedServer = [System.Collections.Generic.HashSet[string]]::new()

          for ($i = 0; $i -lt $comparisonPoints.Count - 1; $i++) {
            $oldRef = $comparisonPoints[$i]
            $newRef = $comparisonPoints[$i + 1]
            Write-Host "Diff $oldRef .. $newRef"

            $delClient = Get-DeletedInDiff -OldRef $oldRef -NewRef $newRef -Prefixes @("client", "shared")
            $addClient = Get-AddedInDiff -OldRef $oldRef -NewRef $newRef -Prefixes @("client", "shared")

            $delServer = Get-DeletedInDiff -OldRef $oldRef -NewRef $newRef -Prefixes @("server", "shared")
            $addServer = Get-AddedInDiff -OldRef $oldRef -NewRef $newRef -Prefixes @("server", "shared")

            foreach ($f in $delClient) { [void]$finalDeletedClient.Add($f) }
            foreach ($f in $addClient) { [void]$finalDeletedClient.Remove($f) }

            foreach ($f in $delServer) { [void]$finalDeletedServer.Add($f) }
            foreach ($f in $addServer) { [void]$finalDeletedServer.Remove($f) }
          }

          function Build-ModifyArray {
            param([System.Collections.Generic.HashSet[string]]$RelativePaths)
            $modify = @()
            foreach ($rel in $RelativePaths) {
              $escaped = [regex]::Escape($rel)
              $modify += [ordered]@{
                type    = "remove"
                pattern = "^$escaped$"
                path    = "."
              }
            }
            return ,$modify
          }

          $clientModify = Build-ModifyArray -RelativePaths $finalDeletedClient
          $serverModify = Build-ModifyArray -RelativePaths $finalDeletedServer

          # 8. Генерируем JSON
          $clientSync = [ordered]@{
            '$schema'   = "https://raw.githubusercontent.com/oxydien/simple-mod-sync/refs/heads/main/schema.json"
            environment = [ordered]@{
              mc_loader  = $mcLoader
              mc_version = $mcVersion
            }
            sync_version = 3
            sync = @(
              [ordered]@{
                type      = "packed"
                url       = "https://github.com/$repo/releases/download/$tag/client.zip"
                name      = "client"
                version   = "$tag"
                directory = "."
              }
            )
            modify = $clientModify
          }
          $clientSync | ConvertTo-Json -Depth 10 | Set-Content -Path "client-sync.json" -Encoding UTF8

          $serverSync = [ordered]@{
            '$schema'   = "https://raw.githubusercontent.com/oxydien/simple-mod-sync/refs/heads/main/schema.json"
            environment = [ordered]@{
              mc_loader  = $mcLoader
              mc_version = $mcVersion
            }
            sync_version = 3
            sync = @(
              [ordered]@{
                type      = "packed"
                url       = "https://github.com/$repo/releases/download/$tag/server.zip"
                name      = "server"
                version   = "$tag"
                directory = "."
              }
            )
            modify = $serverModify
          }
          $serverSync | ConvertTo-Json -Depth 10 | Set-Content -Path "server-sync.json" -Encoding UTF8

      # Генерация списка изменений (с фильтрацией !silent) – по-прежнему от предыдущего тега
      - name: Generate Changelog
        id: changelog
        shell: pwsh
        run: |
          $previousTag = "${{ steps.tag.outputs.previous_tag }}"

          if ($previousTag) {
            $range = "$previousTag..HEAD"
          } else {
            $range = "HEAD"
          }

          $commits = git log $range --pretty=format:"%s"
          if (-not $commits) {
            $commits = @()
          }

          $filtered = $commits | Where-Object { $_ -notmatch '(?i)!s' }

          Write-Host "--- All commits ---"
          $commits | ForEach-Object { Write-Host $_ }
          Write-Host "--- Filtered commits (silent removed) ---"
          $filtered | ForEach-Object { Write-Host $_ }

          if (-not $filtered -or $filtered.Count -eq 0) {
            Write-Host "All commits are !s or no commits found. Skipping notification."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=false" -Encoding utf8NoBOM
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=true" -Encoding utf8NoBOM

            $list = ($filtered | ForEach-Object { "- $_" }) -join "`n"

            Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<EOF" -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_OUTPUT -Value $list -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF" -Encoding utf8NoBOM
          }

      # Создание релиза
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            client.zip
            server.zip
            client-sync.json
            server-sync.json

      # Уведомление в Discord (несколько вебхуков)
      - name: Discord Notification
        if: ${{ steps.changelog.outputs.has_changes == 'true' }}
        shell: pwsh
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          $raw = $env:DISCORD_WEBHOOKS
          if (-not $raw) {
            Write-Host "Discord webhooks are not set, skipping notification."
            exit 0
          }

          $webhooks = $raw -split "[\r\n,]+" | Where-Object { $_.Trim() -ne "" }

          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          $changelog = $env:CHANGELOG
          if (-not $changelog) {
            $changelog = "No changes listed."
          }
          if ($changelog.Length -gt 1000) {
            $changelog = $changelog.Substring(0, 1000) + "`n... (обрезано)"
          }

          $body = @{
            username   = "Update"
            embeds     = @(
              @{
                title       = "Обновление $tag"
                description = "[Новое обновление доступно!]($releaseUrl)"
                color       = 3066993
                fields      = @(
                  @{ name = "Изменения"; value = $changelog; inline = $false }
                  @{ name = "Файлы"; value = "[client.zip](https://github.com/$repo/releases/download/$tag/client.zip)"; inline = $true }
                )
              }
            )
          } | ConvertTo-Json -Depth 10

          foreach ($webhook in $webhooks) {
            $webhook = $webhook.Trim()
            Write-Host "Sending notification to: $webhook"
            try {
              Invoke-RestMethod -Uri $webhook -Method Post -Body $body -ContentType "application/json"
            } catch {
              Write-Host "Failed to send to $webhook`: $_"
            }
          }