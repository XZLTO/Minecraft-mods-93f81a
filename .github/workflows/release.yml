name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Создание папок
      - name: Prepare build
        shell: pwsh
        run: |
          mkdir build
          mkdir build/client
          mkdir build/server

          if (Test-Path "client") {
            Copy-Item client/* build/client -Recurse -Force
          } else {
            Write-Host "Skipping: 'client' folder not found"
          }

          if (Test-Path "shared") {
            Copy-Item shared/* build/client -Recurse -Force
            Copy-Item shared/* build/server -Recurse -Force
          } else {
            Write-Host "Skipping: 'shared' folder not found"
          }

          if (Test-Path "server") {
            Copy-Item server/* build/server -Recurse -Force
          } else {
            Write-Host "Skipping: 'server' folder not found"
          }

      # Архивирование
      - name: Zip Client
        shell: pwsh
        run: Compress-Archive -Path build/client/* -DestinationPath client.zip

      - name: Zip Server
        shell: pwsh
        run: Compress-Archive -Path build/server/* -DestinationPath server.zip

      # Генерация sync-файлов
      - name: Generate Sync Files
        shell: pwsh
        env:
          MC_LOADER: ${{ vars.MC_LOADER }}
          MC_VERSION: ${{ vars.MC_VERSION }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $previousTag = "${{ steps.tag.outputs.previous_tag }}"
          $mcLoader = $env:MC_LOADER
          $mcVersion = $env:MC_VERSION

          Write-Host "Previous tag: $previousTag"
          Write-Host "--- Raw git diff (client/shared) ---"
          git diff --name-status "$previousTag" HEAD -- client shared
          Write-Host "--- Raw git diff (server/shared) ---"
          git diff --name-status "$previousTag" HEAD -- server shared

          function Get-DeletedRelativePaths {
            param(
              [string[]]$Prefixes,
              [string]$PreviousTag
            )

            $result = New-Object System.Collections.Generic.HashSet[string]

            if (-not $PreviousTag) {
              return $result
            }

            $diffOutput = git diff --name-status "$PreviousTag" HEAD -- $Prefixes

            foreach ($line in $diffOutput) {
              if (-not $line) { continue }
              $parts = $line -split "`t"
              $status = $parts[0]
              $filePath = $parts[1]

              if ($status -eq "D") {
                foreach ($prefix in $Prefixes) {
                  if ($filePath -like "$prefix/*") {
                    $rel = $filePath.Substring($prefix.Length + 1)
                    [void]$result.Add($rel)
                    break
                  }
                }
              }
            }

            return $result
          }

          function Build-ModifyArray {
            param([System.Collections.Generic.HashSet[string]]$RelativePaths)

            $modify = @()
            foreach ($rel in $RelativePaths) {
              $escaped = [regex]::Escape($rel)
              $modify += [ordered]@{
                type    = "remove"
                pattern = "^$escaped$"
                path    = "."
              }
            }
            return ,$modify
          }

          $deletedClient = Get-DeletedRelativePaths -Prefixes @("client", "shared") -PreviousTag $previousTag
          $deletedServer = Get-DeletedRelativePaths -Prefixes @("server", "shared") -PreviousTag $previousTag

          $clientModify = Build-ModifyArray -RelativePaths $deletedClient
          $serverModify = Build-ModifyArray -RelativePaths $deletedServer

          $clientSync = [ordered]@{
            '$schema'   = "https://raw.githubusercontent.com/oxydien/simple-mod-sync/refs/heads/main/schema.json"
            environment = [ordered]@{
              mc_loader  = $mcLoader
              mc_version = $mcVersion
            }
            sync_version = 3
            sync = @(
              [ordered]@{
                type      = "packed"
                url       = "https://github.com/$repo/releases/download/$tag/client.zip"
                name      = "client"
                version   = "$tag"
                directory = "."
              }
            )
            modify = $clientModify
          }
          $clientSync | ConvertTo-Json -Depth 10 | Set-Content -Path "client-sync.json" -Encoding UTF8

          $serverSync = [ordered]@{
            '$schema'   = "https://raw.githubusercontent.com/oxydien/simple-mod-sync/refs/heads/main/schema.json"
            environment = [ordered]@{
              mc_loader  = $mcLoader
              mc_version = $mcVersion
            }
            sync_version = 3
            sync = @(
              [ordered]@{
                type      = "packed"
                url       = "https://github.com/$repo/releases/download/$tag/server.zip"
                name      = "server"
                version   = "$tag"
                directory = "."
              }
            )
            modify = $serverModify
          }
          $serverSync | ConvertTo-Json -Depth 10 | Set-Content -Path "server-sync.json" -Encoding UTF8

      # Генерация списка изменений (с фильтрацией !silent)
      - name: Generate Changelog
        id: changelog
        shell: pwsh
        run: |
          $previousTag = "${{ steps.tag.outputs.previous_tag }}"

          if ($previousTag) {
            $range = "$previousTag..HEAD"
          } else {
            $range = "HEAD"
          }

          $commits = git log $range --pretty=format:"%s"
          if (-not $commits) {
            $commits = @()
          }

          # Убираем коммиты с !silent (без учёта регистра)
          $filtered = $commits | Where-Object { $_ -notmatch '(?i)!s' }

          Write-Host "--- All commits ---"
          $commits | ForEach-Object { Write-Host $_ }
          Write-Host "--- Filtered commits (silent removed) ---"
          $filtered | ForEach-Object { Write-Host $_ }

          if (-not $filtered -or $filtered.Count -eq 0) {
            Write-Host "All commits are !silent or no commits found. Skipping notification."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=false" -Encoding utf8NoBOM
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=true" -Encoding utf8NoBOM

            $list = ($filtered | ForEach-Object { "- $_" }) -join "`n"

            Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<EOF" -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_OUTPUT -Value $list -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF" -Encoding utf8NoBOM
          }

      # Создание релиза
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            client.zip
            server.zip
            client-sync.json
            server-sync.json

      # Уведомление в Discord (несколько вебхуков)
      - name: Discord Notification
        if: ${{ steps.changelog.outputs.has_changes == 'true' }}
        shell: pwsh
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          $raw = $env:DISCORD_WEBHOOKS
          if (-not $raw) {
            Write-Host "Discord webhooks are not set, skipping notification."
            exit 0
          }


          # Разделитель: перенос строки или запятая
          $webhooks = $raw -split "[\r\n,]+" | Where-Object { $_.Trim() -ne "" }

          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          $changelog = $env:CHANGELOG
          if (-not $changelog) {
            $changelog = "No changes listed."
          }
          # Discord ограничивает поле embed 1024 символами
          if ($changelog.Length -gt 1000) {
            $changelog = $changelog.Substring(0, 1000) + "`n... (обрезано)"
          }

          $body = @{
            username   = "Update"
            embeds     = @(
              @{
                title       = "Обновление $tag"
                description = "[Новое обновление доступно!]($releaseUrl)"
                color       = 3066993
                fields      = @(
                  @{ name = "Изменения"; value = $changelog; inline = $false }
                  @{ name = "Файлы"; value = "[client.zip](https://github.com/$repo/releases/download/$tag/client.zip)"; inline = $true }
                )
              }
            )
          } | ConvertTo-Json -Depth 10

          foreach ($webhook in $webhooks) {
            $webhook = $webhook.Trim()
            Write-Host "Sending notification to: $webhook"
            try {
              Invoke-RestMethod -Uri $webhook -Method Post -Body $body -ContentType "application/json"
            } catch {
              Write-Host "Failed to send to $webhook`: $_"
            }
          }