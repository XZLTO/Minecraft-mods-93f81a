name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Создание папок
      - name: Prepare build
        shell: pwsh
        run: |
          mkdir build

          mkdir build/client
          Copy-Item client/* build/client -Recurse -Force
          Copy-Item shared/* build/client -Recurse -Force

          mkdir build/server
          Copy-Item server/* build/server -Recurse -Force
          Copy-Item shared/* build/server -Recurse -Force

      # Архивирование
      - name: Zip Client
        shell: pwsh
        run: Compress-Archive -Path build/client/* -DestinationPath client.zip

      - name: Zip Server
        shell: pwsh
        run: Compress-Archive -Path build/server/* -DestinationPath server.zip

      # Создание релиза
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            client.zip
            server.zip